er?\",\"id\":\"Baik. Nomor teleponnya?\"},{\"who\":\"Siti\",\"de\":\"Null, eins, sieben, sechs, drei, vier, neun, zwei.\",\"id\":\"Nol, satu, tujuh, enam, tiga, empat, sembilan, dua.\"}]},\"tirukan\":{\"de\":\"Ich bin dreiundzwanzig Jahre alt.\",\"id\":\"Umurku dua puluh tiga tahun.\"},\"check\":[{\"id\":\"e1-06-c1\",\"why\":{\"id\":\"Satuan dulu, puluhan belakangan: *vier-und-dreißig* = 4 + 30 = 34.\",\"en\":\"Units first, tens last: *vier-und-dreißig* = 4 + 30 = 34.\"},\"type\":\"listen\",\"audio\":\"Ich bin vierunddreißig Jahre alt.\",\"options\":[\"Ich bin vierunddreißig Jahre alt.\",\"Ich bin dreiundvierzig Jahre alt.\"],\"answer\":\"Ich bin vierunddreißig Jahre alt.\"},{\"id\":\"e1-06-c2\",\"why\":{\"id\":\"*Ein-und-zwanzig*: satu dan dua puluh.\",\"en\":\"*Ein-und-zwanzig*: one and twenty.\"},\"type\":\"choice\",\"prompt\":\"21 = ?\",\"options\":[\"einundzwanzig\",\"zwanzigeins\",\"zweiundzwanzig\"],\"answer\":\"einundzwanzig\"},{\"id\":\"e1-06-c3\",\"why\":{\"id\":\"16 = *sechzehn*: *s* dari *sechs* hilang.\",\"en\":\"16 = *sechzehn*: the *s* of *sechs* drops.\"},\"type\":\"dictation\",\"audio\":\"sechzehn\",\"answer\":\"sechzehn\",\"spelling\":\"lenient\",\"nounCaps\":true},{\"id\":\"e1-06-c4\",\"cue\":\"Umurmu berapa?\",\"why\":{\"id\":\"Bahasa Jerman bertanya *seberapa tua*: *Wie alt bist du?*\",\"en\":\"German asks *how old*: *Wie alt bist du?*\"},\"type\":\"gap\",\"prompt\":\"Wie ___ bist du?\",\"options\":[\"alt\",\"viel\",\"wo\"],\"answer\":\"alt\"},{\"id\":\"e1-06-c5\",\"why\":{\"id\":\"*-ßig*/*-zig* = puluhan. 13 = *dreizehn*.\",\"en\":\"*-ßig*/*-zig* = tens. 13 = *dreizehn*.\"},\"lang\":\"id\",\"type\":\"choice\",\"prompt\":\"*Dreißig* adalah …\",\"options\":[\"30\",\"13\",\"33\"],\"answer\":\"30\"},{\"id\":\"e1-06-c6\",\"cue\":\"Umurku 25 tahun.\",\"why\":{\"id\":\"Umur selalu dengan *alt* di akhir: *… Jahre alt*.\",\"en\":\"Age always ends with *alt*: *… Jahre alt*.\"},\"type\":\"fix\",\"wrong\":\"Ich bin 25 Jahre.\",\"options\":[\"Ich bin 25 Jahre alt.\",\"Ich bin 25 alt Jahre.\"],\"answer\":\"Ich bin 25 Jahre alt.\"}],\"glossary\":[{\"de\":\"Jahr\",\"id\":\"tahun\",\"pos\":\"noun\",\"gender\":\"n\",\"plural\":\"Jahre\"},{\"de\":\"Zahl\",\"id\":\"angka\",\"pos\":\"noun\",\"gender\":\"f\",\"plural\":\"Zahlen\"},{\"de\":\"Nummer\",\"id\":\"nomor\",\"pos\":\"noun\",\"gender\":\"f\",\"plural\":\"Nummern\"},{\"de\":\"Telefonnummer\",\"id\":\"nomor telepon\",\"pos\":\"noun\",\"gender\":\"f\",\"plural\":\"Telefonnummern\"},{\"de\":\"Handynummer\",\"id\":\"nomor HP\",\"pos\":\"noun\",\"gender\":\"f\",\"plural\":\"Handynummern\"},{\"de\":\"Wie alt bist du?\",\"id\":\"umurmu berapa?\",\"pos\":\"expr\"},{\"de\":\"Wie alt sind Sie?\",\"id\":\"umur Anda berapa?\",\"pos\":\"expr\"},{\"de\":\"bitte\",\"id\":\"tolong; silakan\",\"pos\":\"interj\"}],\"next\":\"easy1-07-ein-kein\",\"concept\":{\"id\":\"Angka 21–99 dibaca terbalik: satuan dulu, lalu *und*, lalu puluhan: *einundzwanzig* (21), *fünfundvierzig* (45). Ditulis jadi satu kata. Umur: *Ich bin … Jahre alt.* Nomor telepon dibaca angka per angka: *null, eins, fünf …*\",\"en\":\"The numbers 21–99 are said backwards: the units, then *und*, then the tens: *einundzwanzig* (21), *fünfundvierzig* (45). They're written as one word. Age: *Ich bin … Jahre alt.* Phone numbers are read digit by digit: *null, eins, fünf …*\"},\"contrast\":{\"id\":\"Bahasa Indonesia menyebut puluhan dulu: *dua puluh satu*. Bahasa Jerman menyebut satuannya dulu, jadi dengarkan sampai akhir sebelum menulis angkanya. Untuk umur, bahasa Jerman bertanya *seberapa tua* (*Wie alt?*) dan menjawab dengan *alt*.\",\"en\":\"Indonesian says the tens first: *dua puluh satu*. German says the units first, so listen to the end before writing the number down. For age, German asks *how old* (*Wie alt?*) and answers with *alt*.\"},\"slug\":\"06-zahlen\"},\"rung\":{\"id\":\"easy-1\",\"name\":\"Easy 1\",\"subtitle\":\"Hallo!\",\"tier\":\"easy\",\"cefr\":\"A1.1\",\"explain_lang\":\"id\",\"status\":\"live\",\"optional\"
