rja untuk pertanyaan ja/nein: *Wohnst du hier?*\",\"en\":\"Ask with a question word (*wo, woher, was, wer, wie*) + the verb, or start with the verb for a yes/no question: *Wohnst du hier?*\"},\"introduces\":[\"a1-questions\"],\"spiral\":\"word-order\",\"worked\":[{\"de\":\"Du wohnst in Bandung.\",\"id\":\"Kamu tinggal di Bandung.\"},{\"de\":\"Wohnst du in Bandung?\",\"id\":\"Kamu tinggal di Bandung?\"},{\"de\":\"Wo wohnst du?\",\"id\":\"Kamu tinggal di mana?\"}],\"examples\":[{\"de\":\"[[Wo]] wohnst du?\",\"id\":\"Kamu tinggal di mana?\"},{\"de\":\"[[Was]] machst du?\",\"id\":\"Kamu lagi ngapain?\"},{\"de\":\"[[Woher]] kommen Sie?\",\"id\":\"Anda dari mana?\"},{\"de\":\"[[Arbeitest]] du heute?\",\"id\":\"Hari ini kamu kerja?\"},{\"de\":\"[[Sprechen]] Sie Deutsch?\",\"id\":\"Anda bisa bahasa Jerman?\",\"note\":{\"id\":\"*Sprechen* sedikit tidak beraturan: *du sprichst, er spricht*.\",\"en\":\"*Sprechen* is slightly irregular: *du sprichst, er spricht*.\"}},{\"de\":\"[[Wer]] ist das?\",\"id\":\"Itu siapa?\"}],\"pair\":{\"off\":\"Wo du wohnst?\",\"natural\":\"Wo [[wohnst]] du?\"},\"sound\":{\"focus\":\"nada tanya\",\"words\":[\"Wohnst du hier?\",\"Wo wohnst du?\"],\"tip\":{\"id\":\"Pertanyaan ja/nein naik di akhir: *Wohnst du hier?* ↗. Pertanyaan dengan kata tanya biasanya turun: *Wo wohnst du?* ↘.\",\"en\":\"Yes/no questions rise at the end: *Wohnst du hier?* ↗. Questions with a question word usually fall: *Wo wohnst du?* ↘.\"}},\"work\":{\"situation\":{\"id\":\"Di klinik, Budi (peserta Ausbildung perawat) mencatat data pasien baru.\",\"en\":\"At the clinic, Budi (a nursing trainee) takes a new patient's details.\"},\"lines\":[{\"who\":\"Budi\",\"de\":\"Guten Morgen! Wie heißen Sie?\",\"id\":\"Selamat pagi! Siapa nama Bapak?\"},{\"who\":\"Herr Klein\",\"de\":\"Klein. Paul Klein.\",\"id\":\"Klein. Paul Klein.\"},{\"who\":\"Budi\",\"de\":\"Wo wohnen Sie, Herr Klein?\",\"id\":\"Bapak tinggal di mana, Pak Klein?\"},{\"who\":\"Herr Klein\",\"de\":\"Ich wohne hier in Köln.\
