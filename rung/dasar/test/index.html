uarga\",\"jamak\",\"akusatif\",\"möchte dan belanja\",\"letak benda\"],\"threads\":[\"gender\",\"plural\",\"cases\",\"word-order\",\"register\",\"work\"],\"inventory\":[\"a1-greetings-register\",\"a1-sein-heissen\",\"a1-present-regular\",\"a1-verb-second\",\"a1-questions\",\"a1-gender-definite\",\"a1-numbers\",\"a1-indefinite-kein\",\"a1-haben-possessives\",\"a1-plural\",\"a1-accusative\",\"a1-moechte-shopping\",\"a1-place-chunks\"]},\"pool\":{\"rung\":\"dasar\",\"draw\":16,\"pass\":12,\"items\":[{\"id\":\"d-t-01\",\"why\":{\"id\":\"*Koper* datang dari bahasa Belanda *koffer*, sama seperti *der Koffer*.\",\"en\":\"*Koper* comes from Dutch *koffer*, just like *der Koffer*.\"},\"from\":\"dasar-01-kamu-sudah-tahu\",\"lang\":\"id\",\"type\":\"choice\",\"prompt\":\"*Koffer* artinya …\",\"options\":[\"koper\",\"kopi\",\"kantor\"],\"answer\":\"koper\"},{\"id\":\"d-t-02\",\"why\":{\"id\":\"*Hand-tuch*: handuk. *Ch* setelah *u* seperti *kh*.\",\"en\":\"*Hand-tuch*: towel. *Ch* after *u* is like *kh*.\"},\"from\":\"dasar-01-kamu-sudah-tahu\",\"type\":\"listen\",\"audio\":\"das Handtuch\",\"options\":[\"das Handtuch\",\"der Koffer\",\"die Tante\"],\"answer\":\"das Handtuch\"},{\"id\":\"d-t-03\",\"why\":{\"id\":\"Kata benda selalu dengan huruf besar: *Apotheke*.\",\"en\":\"Nouns always take a capital: *Apotheke*.\"},\"from\":\"dasar-01-kamu-sudah-tahu\",\"lang\":\"id\",\"type\":\"choice\",\"prompt\":\"Mana ejaan yang benar?\",\"options\":[\"die Apotheke\",\"die apotheke\",\"Die apotheke\"],\"answer\":\"die Apotheke\"},{\"id\":\"d-t-04\",\"why\":{\"id\":\"*Kantin* ← *kantine* (Belanda) → *die Kantine*.\",\"en\":\"*Kantin* ← *kantine* (Dutch) → *die Kantine*.\"},\"from\":\"dasar-01-kamu-sudah-tahu\",\"lang\":\"id\",\"type\":\"choice\",\"prompt\":\"Kata Jerman mana yang mirip *kantin*?\",\"options\":[\"Kantine\",\"Tante\",\"Strom\"],\"answer\":\"Kantine\"},{\"id\":\"d-t-05\",\"why\":{\"id\":\"*Schon* (sudah): *o* biasa, tanpa umlaut. *Schön* (indah) punya *ö*.\",\"en\":\"*Schon* (
